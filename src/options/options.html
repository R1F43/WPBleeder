<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WPBleeder — Settings</title>
  <style>
    :root {
      --surface-0: #ffffff;
      --surface-1: #f5f5f4;
      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
      --border: rgba(0,0,0,0.08);
      --accent: #2563eb;
      --on-accent: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #1a1a1a;
        --surface-1: #242424;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #6b6b70;
        --border: rgba(255,255,255,0.08);
        --accent: #3b82f6;
        --on-accent: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
      margin: 0;
      padding: 24px;
      font-size: 13px;
      max-width: 480px;
    }
    h1 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 16px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-0);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }
    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    input[type="number"] {
      width: 120px;
    }
    .note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .btn-save {
      padding: 8px 20px;
      border-radius: 6px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-save:hover {
      filter: brightness(1.1);
    }
    #status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <h1>WPBleeder settings</h1>

  <div class="field">
    <label for="api-key">WPScan API key</label>
    <input type="password" id="api-key" placeholder="Enter API key" autocomplete="off">
    <div class="note">Stored locally in the browser (unencrypted). Don't reuse a key you can't afford to expose.</div>
  </div>

  <div class="row">
    <div class="field">
      <label for="concurrency">Plugin scan concurrency</label>
      <input type="number" id="concurrency" min="1" max="20" value="5">
    </div>
    <div class="field">
      <label for="delay">Delay between requests (ms)</label>
      <input type="number" id="delay" min="0" max="5000" step="50" value="200">
    </div>
  </div>

  <button class="btn-save" id="btn-save">Save</button>
  <span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
